services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://servicedesk:${DB_PASSWORD}@db:5432/servicedesk
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
